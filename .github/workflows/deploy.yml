name: Deploy to Vercel

on:
  push:
    branches: [main]

# Runs only once the three required secrets are configured. See the
# "Deployment" section of the README for how to obtain them.
jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Skipped until VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID
    # are added under Settings > Secrets and variables > Actions.
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
